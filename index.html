<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Hand Magic</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #000; overflow: hidden;
      overscroll-behavior: none; touch-action: none;
      width: 100%; height: 100%;
    }

    /* iOS 対策: 画面内に1px残しつつ不可視にする */
    #cam {
      position: fixed;
      top: 0; left: 0;
      width: 1px; height: 1px;
      opacity: 0.001;
      pointer-events: none;
    }

    canvas { display: block; position: fixed; top: 0; left: 0; }

    #overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 999; gap: 24px;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    #overlay .hand { font-size: 80px; animation: bob 1.8s ease-in-out infinite; }
    @keyframes bob {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-12px) scale(1.08); }
    }
    #overlay .msg {
      color: #fff; font-size: 20px;
      font-family: -apple-system, sans-serif;
      letter-spacing: .08em;
    }
    #overlay .sub {
      color: rgba(255,255,255,.4); font-size: 13px;
      font-family: -apple-system, sans-serif;
      text-align: center; padding: 0 40px; line-height: 1.6;
    }

    #status {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,.55); font-size: 13px;
      font-family: -apple-system, sans-serif;
      z-index: 100; pointer-events: none;
      text-align: center;
    }
  </style>
</head>
<body>

<video id="cam" playsinline webkit-playsinline muted autoplay></video>

<div id="overlay">
  <div class="hand">✋</div>
  <div class="msg">タップして開始</div>
  <div class="sub">カメラの使用を許可してください<br>手をかざすとエフェクトが出ます</div>
</div>

<div id="status">カメラを起動中…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
<script>
const overlay = document.getElementById('overlay');
const statusEl = document.getElementById('status');
const camEl = document.getElementById('cam');

let started = false;

async function init() {
  if (started) return;
  started = true;
  overlay.style.display = 'none';
  setStatus('カメラ起動中…');

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'user',
        width: { ideal: 640 },
        height: { ideal: 480 }
      },
      audio: false
    });

    camEl.srcObject = stream;
    await camEl.play();
    setStatus('AI モデル読み込み中…');
    startSketch(); 

  } catch (err) {
    setStatus('カメラエラー: ' + err.message);
  }
}

overlay.addEventListener('click', init);
overlay.addEventListener('touchend', (e) => { e.preventDefault(); init(); }, { passive: false });

function setStatus(msg) { statusEl.textContent = msg; }

function startSketch() {
  new p5(function(p) {
    let handPose;
    let hands = [];
    let particles = [];
    let rings = [];
    let auras = [];
    let bolts = [];
    let fc = 0;
    let modelReady = false;

    const TIPS = [4, 8, 12, 16, 20];
    const PALM = 9;
    const MAX_P = 400, MAX_R = 15, MAX_A = 40;

    p.preload = function() {
      // ml5 v1 の読み込み
      handPose = ml5.handPose();
    };

    p.setup = function() {
      p.createCanvas(p.windowWidth, p.windowHeight);
      p.frameRate(30);

      // 検出開始
      handPose.detectStart(camEl, function(results) {
        hands = results;
        if (!modelReady) {
          modelReady = true;
          setStatus('手をかざしてください ✋');
        }
      });
    };

    function mx(x) {
      const vw = camEl.videoWidth || 640;
      return p.map(x, vw, 0, 0, p.width);
    }
    function my(y) {
      const vh = camEl.videoHeight || 480;
      return p.map(y, 0, vh, 0, p.height);
    }

    p.draw = function() {
      fc++;
      p.clear();

      // 背景（カメラ映像の描画）
      p.push();
      p.translate(p.width, 0);
      p.scale(-1, 1);
      const vw = camEl.videoWidth || 640;
      const vh = camEl.videoHeight || 480;
      const va = vw / vh, wa = p.width / p.height;
      let ix, iy, iw, ih;
      if (wa > va) {
        iw = p.width; ih = p.width / va;
        ix = 0; iy = (p.height - ih) / 2;
      } else {
        iw = p.height * va; ih = p.height;
        ix = (p.width - iw) / 2; iy = 0;
      }
      p.drawingContext.drawImage(camEl, ix, iy, iw, ih);
      p.pop();

      // エフェクト用の半透明レイヤー
      p.background(0, 0, 0, 80);

      for (let hand of hands) {
        const kp = hand.keypoints;
        const px = mx(kp[PALM].x), py = my(kp[PALM].y);

        auras.push(new Aura(px, py));

        if (fc % 15 === 0) rings.push(new Ring(px, py, p.random(150, 300)));

        for (let idx of TIPS) {
          const fx = mx(kp[idx].x), fy = my(kp[idx].y);
          particles.push(new Particle(fx, fy, false, null));
        }

        if (fc % 8 === 0) {
          const tips = TIPS.map(i => ({ x: mx(kp[i].x), y: my(kp[i].y) }));
          const a = tips[Math.floor(p.random(tips.length))];
          const b = tips[Math.floor(p.random(tips.length))];
          if (a !== b) bolts.push(new Bolt(a.x, a.y, b.x, b.y));
        }

        drawPalmOrb(px, py);
        for (let idx of TIPS) drawFingerGlow(mx(kp[idx].x), my(kp[idx].y));

        // 人差し指と親指が近いとき（ピンチ操作で花火）
        const idxTip = kp[8], thumbTip = kp[4];
        if (p.dist(mx(idxTip.x), my(idxTip.y), mx(thumbTip.x), my(thumbTip.y)) < 40) {
          fireWork(mx(idxTip.x), my(idxTip.y));
        }
      }

      // 更新と描画
      for (let i = auras.length-1; i >= 0; i--) { auras[i].update(); auras[i].show(); if (auras[i].done()) auras.splice(i,1); }
      for (let i = rings.length-1; i >= 0; i--) { rings[i].update(); rings[i].show(); if (rings[i].done()) rings.splice(i,1); }
      for (let b of bolts) b.show(); bolts = [];
      for (let i = particles.length-1; i >= 0; i--) { particles[i].update(); particles[i].show(); if (particles[i].done()) particles.splice(i,1); }

      if (particles.length > MAX_P) particles.splice(0, particles.length - MAX_P);
      if (rings.length > MAX_R) rings.splice(0, rings.length - MAX_R);
      if (auras.length > MAX_A) auras.splice(0, auras.length - MAX_A);
    };

    function drawPalmOrb(x, y) {
      const base = 50 + p.sin(fc * 0.1) * 10;
      p.noFill();
      for (let r = base; r > 0; r -= 8) {
        p.stroke(getHSLColor((fc * 2 + r) % 360, 100, 70, p.map(r, 0, base, 200, 0)));
        p.strokeWeight(2);
        p.ellipse(x, y, r * 2);
      }
    }

    function drawFingerGlow(x, y) {
      p.noStroke();
      for (let r = 20; r > 0; r -= 5) {
        p.fill(180, 220, 255, p.map(r, 0, 20, 100, 0));
        p.ellipse(x, y, r * 2);
      }
      p.fill(255, 255, 255, 230);
      p.ellipse(x, y, 6);
    }

    function fireWork(x, y) {
      const col = p.color(p.random(150, 255), p.random(150, 255), 255);
      for (let i = 0; i < 10; i++) particles.push(new Particle(x, y, true, col));
    }

    function getHSLColor(h, s, l, a) {
      p.push();
      p.colorMode(p.HSL);
      let c = p.color(h, s, l, a / 255);
      p.pop();
      return c;
    }

    p.windowResized = function() { p.resizeCanvas(p.windowWidth, p.windowHeight); };

    // クラス定義
    class Ring {
      constructor(x, y, maxR) {
        this.x = x; this.y = y; this.r = 10; this.maxR = maxR;
        this.spd = 8; this.alpha = 255;
        this.hue = p.random(360);
      }
      update() { this.r += this.spd; this.alpha -= 255 / (this.maxR / this.spd); }
      show() {
        p.noFill();
        p.stroke(getHSLColor(this.hue, 100, 70, this.alpha));
        p.strokeWeight(3);
        p.ellipse(this.x, this.y, this.r * 2);
      }
      done() { return this.alpha <= 0; }
    }

    class Aura {
      constructor(x, y) {
        let ang = p.random(p.TWO_PI), d = p.random(20, 60);
        this.x = x + p.cos(ang) * d; this.y = y + p.sin(ang) * d;
        this.vx = p.random(-0.5, 0.5); this.vy = p.random(-2, -0.5);
        this.alpha = 200; this.sz = p.random(5, 12);
        this.hue = p.random(180, 280);
      }
      update() { this.x += this.vx; this.y += this.vy; this.alpha -= 8; this.sz *= 0.96; }
      show() {
        p.noStroke();
        p.fill(getHSLColor(this.hue, 100, 75, this.alpha));
        p.ellipse(this.x, this.y, this.sz);
      }
      done() { return this.alpha <= 0; }
    }

    class Bolt {
      constructor(x1, y1, x2, y2) {
        this.pts = [];
        let n = 5;
        for(let i=0; i<=n; i++) {
          this.pts.push({
            x: p.lerp(x1, x2, i/n) + (i==0 || i==n ? 0 : p.random(-20, 20)),
            y: p.lerp(y1, y2, i/n) + (i==0 || i==n ? 0 : p.random(-20, 20))
          });
        }
        this.hue = p.random(180, 240);
      }
      show() {
        p.noFill();
        p.stroke(255, 255, 255, 200); p.strokeWeight(2);
        p.beginShape();
        for(let pt of this.pts) p.vertex(pt.x, pt.y);
        p.endShape();
      }
    }

    class Particle {
      constructor(x, y, isExp, col) {
        this.x = x; this.y = y;
        if(isExp) {
          let a = p.random(p.TWO_PI), s = p.random(2, 8);
          this.vx = p.cos(a) * s; this.vy = p.sin(a) * s;
          this.col = col; this.sz = p.random(4, 10);
        } else {
          this.vx = p.random(-1, 1); this.vy = p.random(-3, -1);
          this.col = p.color(200, 230, 255); this.sz = p.random(2, 6);
        }
        this.alpha = 255; this.g = 0.15;
      }
      update() { this.x += this.vx; this.y += this.vy; this.vy += this.g; this.alpha -= 10; }
      show() {
        p.noStroke();
        let c = this.col;
        p.fill(p.red(c), p.green(c), p.blue(c), this.alpha);
        p.ellipse(this.x, this.y, this.sz);
      }
      done() { return this.alpha <= 0; }
    }
  });
}
</script>
</body>
</html>
