<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- iOS Safari 対応 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hand Magic">
  <title>✨ Hand Magic - AIハンドエフェクト</title>
  <meta name="description" content="Webカメラで手を検出し、指先から美しいパーティクルエフェクトが飛び出すインタラクティブAI体験">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <!-- ml5.js v1 -->
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Debug Console -->
  <div id="debug-console" style="position:fixed; top:10px; left:10px; z-index:9999; background:rgba(0,0,0,0.7); color:#0f0; font-family:monospace; font-size:11px; padding:8px; border-radius:4px; pointer-events:none; max-width:80vw; max-height:40vh; overflow-y:auto; line-height:1.4;">
    <div>[System] 初期化完了. 待機中...</div>
  </div>
  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="loader-content">
      <!-- 初期表示: タップして開始ボタン -->
      <div id="start-screen">
        <div class="start-icon">✨</div>
        <h2 class="loader-title">Hand Magic</h2>
        <p class="loader-subtitle">カメラで手のエフェクトを体験しよう</p>
        <button id="btn-start" class="start-btn">タップしてカメラを起動</button>
        <p class="loader-note">カメラの使用許可が必要です</p>
      </div>
      <!-- 読み込み中表示 -->
      <div id="loading-screen" style="display:none">
        <div class="loader-spinner"></div>
        <h2 class="loader-title">AIモデルを読み込み中...</h2>
        <p class="loader-subtitle">少々お待ちください</p>
      </div>
      <!-- エラー表示 -->
      <div id="error-screen" style="display:none">
        <div class="error-icon">⚠️</div>
        <h2 class="loader-title error-title">カメラを起動できませんでした</h2>
        <p id="error-message" class="loader-subtitle"></p>
        <button id="btn-retry" class="start-btn">もう一度試す</button>
      </div>
    </div>
  </div>

  <!-- UI Overlay -->
  <div id="ui-overlay">
    <header id="app-header">
      <h1 id="app-title">✨ Hand Magic</h1>
      <p id="app-subtitle">手をかざして魔法をかけよう</p>
    </header>

    <div id="controls-panel">
      <button id="btn-effect-sparkle" class="effect-btn active" data-effect="sparkle">
        <span class="effect-icon">✨</span>
        <span class="effect-label">スパークル</span>
      </button>
      <button id="btn-effect-fire" class="effect-btn" data-effect="fire">
        <span class="effect-icon">🔥</span>
        <span class="effect-label">ファイア</span>
      </button>
      <button id="btn-effect-galaxy" class="effect-btn" data-effect="galaxy">
        <span class="effect-icon">🌌</span>
        <span class="effect-label">ギャラクシー</span>
      </button>
      <button id="btn-effect-sakura" class="effect-btn" data-effect="sakura">
        <span class="effect-icon">🌸</span>
        <span class="effect-label">桜吹雪</span>
      </button>
      <button id="btn-effect-lightning" class="effect-btn" data-effect="lightning">
        <span class="effect-icon">⚡</span>
        <span class="effect-label">雷光</span>
      </button>
      <button id="btn-debug" class="effect-btn debug-btn">
        <span class="effect-icon">👁️</span>
        <span class="effect-label">認識確認</span>
      </button>
    </div>

    <div id="status-bar">
      <span id="hand-status" class="status-badge">🖐️ 手を検出中...</span>
      <span id="fps-counter" class="status-badge">FPS: --</span>
    </div>
  </div>

  <!-- p5.js sketch -->
  <script src="sketch.js"></script>
</body>
</html>
