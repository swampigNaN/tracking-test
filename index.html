<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hand Tracking Fullscreen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; touch-action: none; font-family: sans-serif; }
    /* ビデオ自体は最小サイズで隠す */
    #cam { position: fixed; width: 10px; height: 10px; opacity: 0.01; pointer-events: none; }
    canvas { display: block; }
    #status {
      position: fixed; top: 20px; left: 20px; color: #0f0; 
      z-index: 100; font-family: monospace; background: rgba(0,0,0,0.7);
      padding: 10px; border-radius: 5px; pointer-events: none;
    }
    #overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.9);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 1000; color: #fff; cursor: pointer; text-align: center;
    }
  </style>
</head>
<body>

<video id="cam" playsinline muted autoplay></video>
<div id="status">Status: 待機中...<br>Brave Shieldsをオフにしてください</div>
<div id="overlay" onclick="init()">
  <div style="font-size: 40px; margin-bottom: 10px;">✋</div>
  <p>タップして解析開始</p>
  <p style="font-size: 12px; margin-top: 10px; opacity: 0.6;">(Braveで動かない場合は、ライオンアイコンの設定をオフにしてください)</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>

<script>
const statusEl = document.getElementById('status');
const camEl = document.getElementById('cam');
const overlay = document.getElementById('overlay');
let started = false;

function setLog(msg) { statusEl.innerHTML = `Status: ${msg}`; }

async function init() {
  if (started) return;
  started = true;
  overlay.style.display = 'none';
  setLog('カメラ接続中...');

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    camEl.srcObject = stream;
    await camEl.play();
    setLog('AIモデルロード中...');
    new p5(sketch);
  } catch (err) {
    setLog(`エラー: ${err.name}<br>HTTPS接続とカメラ許可を確認してください`);
  }
}

const sketch = (p) => {
  let handPose;
  let hands = [];

  p.preload = () => {
    handPose = ml5.handPose({ flipped: true });
  };

  p.setup = () => {
    p.createCanvas(p.windowWidth, p.windowHeight);
    handPose.detectStart(camEl, (results) => {
      hands = results;
    });
    setLog('解析中: 手をかざしてください');
  };

  p.draw = () => {
    p.background(0);

    // 画面いっぱいに描画するための計算
    const vw = camEl.videoWidth;
    const vh = camEl.videoHeight;
    if (vw === 0) return;

    const screenRatio = p.width / p.height;
    const videoRatio = vw / vh;
    
    let drawW, drawH, offsetLineX = 0, offsetLineY = 0;

    if (screenRatio > videoRatio) {
      drawW = p.width;
      drawH = p.width / videoRatio;
    } else {
      drawW = p.height * videoRatio;
      drawH = p.height;
    }
    
    const dx = (p.width - drawW) / 2;
    const dy = (p.height - drawH) / 2;

    // カメラ映像の描画（左右反転）
    p.push();
    p.translate(p.width, 0);
    p.scale(-1, 1);
    p.image(camEl, (p.width - drawW) / 2, (p.height - drawH) / 2, drawW, drawH);
    p.pop();

    // 映像の上に少し暗いベールをかけて点を見やすくする
    p.fill(0, 0, 0, 80);
    p.rect(0, 0, p.width, p.height);

    if (hands.length > 0) {
      setLog(`解析OK: ${hands.length}本の手を検知`);
      
      for (let hand of hands) {
        for (let i = 0; i < hand.keypoints.length; i++) {
          let kp = hand.keypoints[i];
          
          // 映像の拡大・オフセットに合わせた正確な座標変換
          // flipped: true なので x 座標の計算に注意
          let x = p.map(kp.x, 0, vw, p.width - dx, -dx);
          let y = p.map(kp.y, 0, vh, dy, drawH + dy);

          // 指先(4, 8, 12, 16, 20)は白く大きく、他は小さく
          if ([4, 8, 12, 16, 20].includes(i)) {
            p.fill(255);
            p.stroke(0, 255, 255);
            p.strokeWeight(2);
            p.circle(x, y, 12);
          } else {
            p.noStroke();
            p.fill(255, 200);
            p.circle(x, y, 5);
          }
        }
      }
    } else {
      setLog('手が見つかりません...<br>カメラから30〜50cm離してください');
    }
  };

  p.windowResized = () => p.resizeCanvas(p.windowWidth, p.windowHeight);
};
</script>
</body>
</html>
