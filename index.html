<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hand Tracking Debugger</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; touch-action: none; font-family: sans-serif; }
    #cam { position: fixed; width: 1px; height: 1px; opacity: 0.01; }
    #status { position: fixed; top: 10px; left: 10px; color: #0f0; z-index: 10; font-size: 14px; background: rgba(0,0,0,0.5); padding: 5px; }
    #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; color: #fff; cursor: pointer; }
  </style>
</head>
<body>

<video id="cam" playsinline muted autoplay></video>
<div id="status">システム待機中...</div>
<div id="overlay" onclick="init()">
  <p>画面をタップして解析開始</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
<script>
const statusEl = document.getElementById('status');
const camEl = document.getElementById('cam');
let started = false;

function setLog(msg) { statusEl.textContent = `Status: ${msg}`; }

async function init() {
  if (started) return;
  started = true;
  document.getElementById('overlay').style.display = 'none';
  setLog('カメラ起動中...');

  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: 640, height: 480 }
  });
  camEl.srcObject = stream;
  await camEl.play();
  setLog('AIモデル読み込み中...');
  new p5(sketch);
}

const sketch = (p) => {
  let handPose;
  let hands = [];
  let isModelReady = false;

  p.preload = () => {
    handPose = ml5.handPose({ flipped: true });
  };

  p.setup = () => {
    p.createCanvas(p.windowWidth, p.windowHeight);
    handPose.detectStart(camEl, (results) => {
      hands = results;
      if (!isModelReady) {
        isModelReady = true;
        setLog('解析実行中：手をかざしてください');
      }
    });
  };

  p.draw = () => {
    p.clear();

    // 1. 背景カメラ映像（左右反転して描画）
    p.push();
    p.translate(p.width, 0);
    p.scale(-1, 1);
    const vw = camEl.videoWidth || 640;
    const vh = camEl.videoHeight || 480;
    let iw = p.width, ih = p.width * (vh / vw);
    if (ih < p.height) { ih = p.height; iw = p.height * (vw / vh); }
    p.image(camEl, (p.width - iw) / 2, (p.height - ih) / 2, iw, ih);
    p.pop();

    // 暗めのフィルターをかけて点を見やすくする
    p.background(0, 0, 0, 100);

    // 2. 解析結果の描画
    if (hands.length > 0) {
      for (let hand of hands) {
        // 全21箇所の関節（keypoints）をループ
        for (let i = 0; i < hand.keypoints.length; i++) {
          let kp = hand.keypoints[i];
          
          // 座標の変換（カメラ解像度 -> 画面サイズ）
          let x = p.map(kp.x, 0, vw, p.width, 0);
          let y = p.map(kp.y, 0, vh, 0, p.height);

          // 指先（4, 8, 12, 16, 20番）だけ少し大きく白く光らせる
          if ([4, 8, 12, 16, 20].includes(i)) {
            p.fill(255);
            p.stroke(0, 255, 255);
            p.strokeWeight(2);
            p.circle(x, y, 16);
            // 番号を表示
            p.noStroke();
            p.fill(0, 255, 255);
            p.textSize(12);
            p.text(i, x + 12, y);
          } else {
            // その他の関節は小さなグレーの点
            p.fill(200);
            p.noStroke();
            p.circle(x, y, 8);
          }
        }
        
        // 骨格をつなぐ（人差し指の例）
        drawBone(hand.keypoints, [5, 6, 7, 8], vw, vh, p);
        // 他の指も同様に...
      }
    }
  };

  function drawBone(keypoints, indices, vw, vh, p) {
    p.noFill();
    p.stroke(255, 150);
    p.strokeWeight(2);
    p.beginShape();
    for (let idx of indices) {
      let x = p.map(keypoints[idx].x, 0, vw, p.width, 0);
      let y = p.map(keypoints[idx].y, 0, vh, 0, p.height);
      p.vertex(x, y);
    }
    p.endShape();
  }

  p.windowResized = () => p.resizeCanvas(p.windowWidth, p.windowHeight);
};
</script>
</body>
</html>
