<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Camera Connection Test</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #000; overflow: hidden; }

    /* ビデオを背面に全画面表示 */
    #cam {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover; /* 画面いっぱいに広げる */
      z-index: 1;
      transform: scaleX(-1); /* 自撮りモード（反転） */
    }

    /* キャンバスを前面に配置 */
    canvas {
      position: fixed;
      top: 0; left: 0;
      z-index: 2;
      pointer-events: none; /* タップをビデオやボタンに通す */
    }

    #overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; color: #fff; font-family: sans-serif; cursor: pointer;
    }
  </style>
</head>
<body>

<video id="cam" playsinline muted autoplay></video>

<div id="overlay" onclick="init()">
  <p>タップしてカメラを確認</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
<script>
let started = false;
const camEl = document.getElementById('cam');

async function init() {
  if (started) return;
  started = true;
  document.getElementById('overlay').style.display = 'none';

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
    });
    camEl.srcObject = stream;
    // ビデオ再生が始まったらp5.jsを開始
    camEl.onloadedmetadata = () => {
      new p5(sketch);
    };
  } catch (e) {
    alert("カメラが起動できません: " + e.message);
  }
}

const sketch = (p) => {
  let handPose;
  let hands = [];

  p.preload = () => {
    handPose = ml5.handPose({ flipped: true });
  };

  p.setup = () => {
    // 画面サイズぴったりにキャンバスを作成
    p.createCanvas(p.windowWidth, p.windowHeight);
    
    // 解析開始
    handPose.detectStart(camEl, (results) => {
      hands = results;
    });
  };

  p.draw = () => {
    // 毎フレーム画面をクリア（透明にする）
    p.clear();

    if (hands.length > 0) {
      for (let hand of hands) {
        // 指先のポイント（4, 8, 12, 16, 20）だけ描画
        const tips = [4, 8, 12, 16, 20];
        
        for (let i of tips) {
          let kp = hand.keypoints[i];
          
          // ビデオの表示サイズと座標を合わせる計算
          // object-fit: cover を考慮した座標変換
          let screenPos = calculateCapturePos(kp.x, kp.y, camEl, p);

          // 検知している場所に「白い点」を打つ
          p.fill(255);
          p.stroke(0);
          p.strokeWeight(2);
          p.circle(screenPos.x, screenPos.y, 20);
        }
      }
    }
  };

  // 映像の表示位置と指の位置をピタリと合わせるための計算
  function calculateCapturePos(kx, ky, video, p) {
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    const cw = p.width;
    const ch = p.height;
    
    const vRatio = vw / vh;
    const cRatio = cw / ch;
    
    let x, y, scale;

    if (cRatio > vRatio) {
      scale = cw / vw;
      x = kx * scale;
      y = ky * scale - (vh * scale - ch) / 2;
    } else {
      scale = ch / vh;
      x = kx * scale - (vw * scale - cw) / 2;
      y = ky * scale;
    }
    // 反転対応（自撮りモード）
    return { x: cw - x, y: y };
  }

  p.windowResized = () => p.resizeCanvas(p.windowWidth, p.windowHeight);
};
</script>
</body>
</html>
