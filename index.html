<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Brave Debug</title>
  <style>
    body { background: #222; color: #fff; font-family: monospace; padding: 20px; }
    #v { width: 320px; height: 240px; background: #000; border: 1px solid #555; }
    .log { margin: 10px 0; padding: 5px; background: #333; }
    .ok { color: #0f0; }
    .err { color: #f00; }
  </style>
</head>
<body>
  <h2>Brave 動作診断</h2>
  <div id="step1" class="log">1. カメラ確認中...</div>
  <div id="step2" class="log">2. AIモデル読み込み中...</div>
  <video id="v" playsinline muted autoplay></video>
  <canvas id="c"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>

  <script>
    const s1 = document.getElementById('step1');
    const s2 = document.getElementById('step2');
    const video = document.getElementById('v');

    async function start() {
      // Step 1: Camera
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        s1.textContent = "1. カメラ起動成功";
        s1.classList.add('ok');
      } catch (e) {
        s1.textContent = "1. カメラ失敗: " + e.message;
        s1.classList.add('err');
      }

      // Step 2: AI (ml5)
      try {
        if (typeof ml5 === 'undefined') {
          throw new Error("ml5ライブラリがブロックされています");
        }
        const handPose = ml5.handPose(() => {
          s2.textContent = "2. AIモデル読み込み完了！認識可能です";
          s2.classList.add('ok');
        });
        handPose.detectStart(video, (results) => {
          if(results.length > 0) {
            s2.textContent = "2. 手を検知中！ (解析OK)";
          }
        });
      } catch (e) {
        s2.textContent = "2. AI失敗: " + e.message;
        s2.classList.add('err');
      }
    }

    // Braveではクリック等のユーザーアクションがないと開始できない
    document.body.addEventListener('click', start, { once: true });
    s1.textContent = "画面をタップして診断開始";
  </script>
</body>
</html>
