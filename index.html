<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pose Detection Test</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <script src="https://unpkg.com/ml5@1.2.0/dist/ml5.min.js"></script>
  <style>
    body {
      margin: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <script>
    let video;
    let bodyPose;
    let poses = [];

    function preload() {
      // 骨格検知モデルの初期化
      bodyPose = ml5.bodyPose("MoveNet", { flipHorizontal: true });
    }

    function setup() {
      // 画面サイズに合わせたキャンバスの作成
      createCanvas(640, 480);
      
      // スマホのカメラ映像（インカメラ優先）を取得
      const constraints = {
        video: {
          facingMode: "user",
          width: 640,
          height: 480
        },
        audio: false
      };
      video = createCapture(constraints);
      video.size(640, 480);
      video.hide();

      // 骨格のリアルタイム繰り返し検知を開始
      bodyPose.detectStart(video, gotPoses);
    }

    function draw() {
      // 鏡のように見せるため左右を反転して描画
      translate(width, 0);
      scale(-1, 1);
      image(video, 0, 0, width, height);

      // 検知された関節の座標に円を描画
      for (let i = 0; i < poses.length; i++) {
        let pose = poses[i];
        for (let j = 0; j < pose.keypoints.length; j++) {
          let keypoint = pose.keypoints[j];
          // 判定の信頼度が0.2以上の場合のみ描画
          if (keypoint.confidence > 0.2) {
            fill(0, 255, 0);
            noStroke();
            circle(keypoint.x, keypoint.y, 12);
          }
        }
      }
    }

    function gotPoses(results) {
      // 検知データの更新
      poses = results;
    }
  </script>
</body>
</html>
